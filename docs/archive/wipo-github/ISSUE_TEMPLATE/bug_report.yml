name: Bug 报告 / Bug Report
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认已搜索过现有 issue，避免重复。
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 发生了什么，与本应发生的行为有何不同
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好，含具体商标名与命令
      placeholder: |
        1. 运行 `python cli.py run`
        2. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: README 顶部的版本号或 git commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      value: |
        - OS:
        - Python:
        - MySQL:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 注意脱敏，不要粘贴邮箱密码或密钥
      render: shell
    validations:
      required: false
