[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wipo-trademark-monitor"
version = "2.0.0"
description = "WIPO 商标监控系统 —— 自动检查商标状态与被抢注情况（FastAPI 分层架构）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["wipo", "trademark", "monitor", "fastapi"]
authors = [{ name = "DoonaSuzy" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    # ---- Web 框架（FastAPI 单一后端框架，不使用 Flask）----
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    # ---- 配置与校验 ----
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    # ---- 数据库（异步 ORM）----
    "sqlalchemy[asyncio]==2.1.4",
    "aiomysql==0.3.2",
    "PyMySQL==1.2.3",
    "alembic==1.20.0",
    # ---- HTTP 客户端（WIPO 私有接口）----
    "requests==2.34.2",
    # ---- 加密（WIPO 响应 AES-ECB 解密，纯 Python 实现，无外部依赖）----
    "pycryptodome>=3.20.0",
    # ---- 导入导出 ----
    "python-multipart==0.0.32",
    "openpyxl==3.1.5",
    # ---- 日志 ----
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-html==4.2.0",
    "playwright==1.62.0",
    "httpx==0.28.1",
    "ruff==0.17.0",
    # 测试库驱动：conftest 把数据库覆盖成 sqlite+aiosqlite:///
    "aiosqlite==0.22.1",
]

[project.scripts]
wipo-monitor = "cli:main"

[project.urls]
Homepage = "https://github.com/DoonaSuzy/WIPO_and_Brand"
Repository = "https://github.com/DoonaSuzy/WIPO_and_Brand"
Issues = "https://github.com/DoonaSuzy/WIPO_and_Brand/issues"
Changelog = "https://github.com/DoonaSuzy/WIPO_and_Brand/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入必须把 Depends()/Query() 写在默认值里，这是框架约定，
# 不是「可变默认值」那类 bug。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]
