# ==================== 迁移期双栈：新旧测试目录分开收集 ====================
# C 方案要求后端只用 FastAPI。但迁移期新旧两套实现同时存在：
#   tests/      E2E 回归防线（110 项，Playwright 真实浏览器，服务器是 uvicorn）
#   tests_new/  FastAPI 栈的单元/契约防线（43 项，TestClient，不碰浏览器）
# 在 FastAPI 版被证明能完全替代之前两套都要跑；两个目录各有 conftest，
# 用 testpaths 分开指定，避免两套 fixture 与端口互相干扰。
#
# ⚠️ **两个目录不能在同一次 pytest 调用里同时收集**：
#    两边都有一个 conftest.py，且都通过 rootdir 插入 sys.path，
#    同时指定会导致 `from conftest import ...` 导入到另一个目录的 conftest
#    （实测：tests/test_reports.py 报
#     `ImportError: cannot import name 'FAKE_REPORT' from 'conftest'`
#     导入的其实是 tests_new/conftest.py）。因此要全跑就分两次：
#        python -m pytest tests      # E2E（110 项）
#        python -m pytest tests_new  # 单元/契约（43 项）
#
# 注意：pyproject.toml 里也有一份 [tool.pytest.ini_options]（供不依赖
# 本文件的新环境使用）。**pytest.ini 优先级更高**，所以这里仍是实际生效
# 的配置；两份保持一致，避免「本地跑一套、CI 跑另一套」。
[pytest]
testpaths = tests
addopts = -v --html=test-results/report.html --self-contained-html
markers =
    e2e: Playwright 浏览器端到端测试

