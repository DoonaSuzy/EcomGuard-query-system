<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIPO 商标监控系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M12 22V12" stroke="currentColor" stroke-width="2"/>
                    <path d="M2 7l10 5 10-5" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>商标监控</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-item active" data-page="input">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>商标录入</span>
                </a>
                <a href="#" class="nav-item" data-page="list">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>商标清单</span>
                </a>
                <a href="#" class="nav-item" data-page="check">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>状态检查</span>
                </a>
                <a href="#" class="nav-item" data-page="reports">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>检查报告</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="version">v1.0.0</div>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 id="page-title">商标录入</h1>
                <div class="header-actions">
                    <span class="trademark-count">共 <span id="total-count">0</span> 个商标</span>
                </div>
            </header>

            <!-- 商标录入页面 -->
            <section id="page-input" class="page active">
                <div class="card">
                    <div class="card-header">
                        <h2>添加商标</h2>
                        <p class="subtitle">输入商标信息，系统将自动保存用于后续检查</p>
                    </div>
                    <form id="trademark-form" class="form">
                        <div class="form-group">
                            <label for="brandName">商标名称 <span class="required">*</span></label>
                            <input type="text" id="brandName" name="brandName" 
                                   placeholder="例如：APPLE" 
                                   maxlength="200"
                                   autocomplete="off">
                            <div class="form-hint">
                                <span>2-200 个字符</span>
                                <span class="char-count" id="brandName-count">0/200</span>
                            </div>
                            <div class="form-error" id="brandName-error"></div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="applicant">申请人</label>
                                <input type="text" id="applicant" name="applicant" 
                                       placeholder="公司全称" 
                                       autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label for="registrationNumber">注册号</label>
                                <input type="text" id="registrationNumber" name="registrationNumber" 
                                       placeholder="可选" 
                                       autocomplete="off">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="niceClass">尼斯分类</label>
                            <input type="text" id="niceClass" name="niceClass" 
                                   placeholder="多个分类用逗号分隔，例如：9, 35"
                                   autocomplete="off">
                            <div class="form-hint">
                                常见分类：9(电子)、25(服装)、35(广告)、42(科技)
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">备注</label>
                            <textarea id="notes" name="notes" rows="3" 
                                      placeholder="可选，添加备注信息"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="reset" class="btn btn-secondary" id="btn-cancel">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16M8 16H3v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                重置
                            </button>
                            <button type="submit" class="btn btn-primary" id="btn-submit">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span id="btn-text">添加商标</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card quick-add">
                    <div class="card-header">
                        <h2>批量导入</h2>
                        <p class="subtitle">支持 JSON 和 CSV 格式批量导入商标数据</p>
                    </div>
                    <div class="import-area">
                        <input type="file" id="import-file" accept=".json,.csv" hidden>
                        <button class="btn btn-outline" id="btn-import">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            选择文件
                        </button>
                        <span class="import-status" id="import-status"></span>
                    </div>
                    <div class="export-area">
                        <button class="btn btn-outline" id="btn-export-json">导出 JSON</button>
                        <button class="btn btn-outline" id="btn-export-csv">导出 CSV</button>
                    </div>
                </div>
            </section>

            <!-- 商标清单页面 -->
            <section id="page-list" class="page">
                <div class="card">
                    <div class="card-header">
                        <h2>商标清单</h2>
                        <div class="list-actions">
                            <div class="search-box">
                                <input type="text" id="search-input" placeholder="搜索商标...">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <button class="btn btn-danger btn-sm" id="btn-batch-delete" disabled>
                                批量删除
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="select-all"></th>
                                    <th>商标名称</th>
                                    <th>申请人</th>
                                    <th>注册号</th>
                                    <th>尼斯分类</th>
                                    <th>备注</th>
                                    <th>添加时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="trademark-table-body">
                            </tbody>
                        </table>
                        <div class="empty-state" id="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <p>暂无商标数据</p>
                            <span>请在"商标录入"页面添加商标</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 状态检查页面 -->
            <section id="page-check" class="page">
                <div class="card">
                    <div class="card-header">
                        <h2>商标状态检查</h2>
                        <p class="subtitle">调用 WIPO BrandDB API 检查商标状态和疑似抢注情况</p>
                    </div>
                    <div class="check-options">
                        <label class="checkbox-item">
                            <input type="checkbox" id="check-status" checked>
                            <span>检查商标状态</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="check-squatting" checked>
                            <span>检查疑似抢注</span>
                        </label>
                    </div>
                    <div class="check-actions">
                        <button class="btn btn-primary btn-lg" id="btn-start-check">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="5,3 19,12 5,21" fill="currentColor"/>
                            </svg>
                            开始检查
                        </button>
                    </div>
                    <div class="check-status" id="check-status-display" style="display:none;">
                        <div class="spinner"></div>
                        <span id="check-status-text">检查进行中...</span>
                    </div>
                </div>

                <div class="card" id="check-result-card" style="display:none;">
                    <div class="card-header">
                        <h2>检查结果</h2>
                    </div>
                    <div class="summary-cards" id="summary-cards"></div>
                    <div class="alerts-list" id="alerts-list"></div>
                </div>
            </section>

            <!-- 检查报告页面 -->
            <section id="page-reports" class="page">
                <div class="card">
                    <div class="card-header">
                        <h2>历史报告</h2>
                    </div>
                    <div class="reports-list" id="reports-list"></div>
                </div>

                <div class="card" id="report-detail-card" style="display:none;">
                    <div class="card-header">
                        <h2 id="report-detail-title">报告详情</h2>
                        <button class="btn btn-ghost" id="btn-close-report">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            返回
                        </button>
                    </div>
                    <div class="report-detail" id="report-detail"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 确认对话框 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">确认操作</h3>
            </div>
            <div class="modal-body">
                <p id="modal-message"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancel">取消</button>
                <button class="btn btn-danger" id="modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
