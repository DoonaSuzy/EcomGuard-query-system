name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码质量与测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 依赖清单一致性（requirements.txt 与 pyproject 不得漂移）
        run: python scripts/check_deps_consistency.py

      - name: 代码检查 ruff
        run: python -m ruff check app tests tests_new cli.py verify_fixes.py verify_new_stack.py

      - name: 契约与服务层测试
        run: python -m pytest tests_new -q

      - name: 缺陷回归断言（新栈）
        run: python verify_new_stack.py

      - name: 缺陷回归断言（历史）
        run: python verify_fixes.py

      - name: 接口契约漂移检测
        run: python tests/test_api_schema.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
