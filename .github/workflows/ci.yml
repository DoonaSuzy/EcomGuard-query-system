name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

jobs:
  # ---------- Job 1：lint（快，先跑先挂） ----------
  lint:
    name: 代码检查 ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: pip install ruff==0.17.0
      # 聚合层 + WIPO 全部源码与测试：零容忍（本仓现状全绿）
      - name: ruff check（聚合层 + WIPO，零容忍）
        run: python -m ruff check aggregator.py credit_api_glue.py tools modules/wipo/app modules/wipo/tests modules/wipo/tests_new modules/wipo/cli.py modules/wipo/verify_fixes.py modules/wipo/verify_new_stack.py
      # credit 测试文件存在 19 项上游既有 lint error（modules/credit 从原仓
      # 平移进来时就带），本轮 CI 先只守「不再新增」：--exit-zero 出报告不拦门。
      # 归零属于后续 credit ruff 配置任务，见 docs 与 P1 清单。
      - name: ruff check（credit，基线守卫，暂不拦截）
        run: python -m ruff check modules/credit/test_regression.py modules/credit/notify.py modules/credit/healthcheck.py --exit-zero

  # ---------- Job 2：三套 pytest（必须分开跑，conftest 同名冲突） ----------
  tests:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 不进矩阵：requirements.txt 钉死 numpy==2.5.4（onnxruntime 链），
        # 该版本声明 Requires-Python >=3.12，3.11 装不上（CI 首跑实测）。
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（requirements.txt 是三模块依赖并集，版本已实测互容）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 口径与 README「测试口径」注一致：三个套件必须分开跑——
      # wipo 的 tests/ 与 tests_new/ 各有一个同名 conftest.py，
      # 合跑报 ImportError: cannot import name 'FAKE_REPORT' from 'conftest'。
      - name: credit 回归（201）
        working-directory: modules/credit
        run: python -m pytest test_regression.py -q
      - name: WIPO 契约（43）
        working-directory: modules/wipo
        run: python -m pytest tests_new -q
      - name: WIPO 缺陷回归断言（68 + 63，不经 pytest）
        working-directory: modules/wipo
        run: |
          python verify_fixes.py
          python verify_new_stack.py
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            modules/wipo/test-results/
            modules/credit/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------- Job 3：E2E + 聚合真机验收（单 job，重） ----------
  e2e:
    name: E2E（110）+ 聚合验收（37）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 安装 Playwright chromium（WIPO E2E 用；camoufox 的 firefox 只在真实巡检时才需要）
        run: python -m playwright install --with-deps chromium
      - name: 构建两套前端产物
        run: python tools/build_frontends.py
      - name: WIPO E2E（110，打默认 base 的 dist/）
        working-directory: modules/wipo
        run: python -m pytest tests -q
      - name: 聚合真机验收（37，起 uvicorn + 真 Chromium，打 dist-agg/）
        run: python tools/accept_aggregated.py
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            modules/wipo/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7
