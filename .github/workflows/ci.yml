name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  # 定时巡检的 next_run_at 是「本地时间」语义（schedule.py 按本地墙钟算），
  # docker-compose 里也设了 TZ=Asia/Shanghai。CI runner 默认 UTC，不设这里
  # test_update_recomputes_next_run 会拿到 2026-11-05T18:00:00+00:00 而失败。
  TZ: Asia/Shanghai

jobs:
  # ---------- Job 1：lint（快，先跑先挂） ----------
  lint:
    name: 代码检查 ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: pip install ruff==0.17.0
      # 聚合层 + WIPO 全部源码与测试：零容忍（本仓现状全绿）
      - name: ruff check（聚合层 + WIPO，零容忍）
        run: python -m ruff check aggregator.py credit_api_glue.py tools modules/wipo/app modules/wipo/tests modules/wipo/tests_new modules/wipo/cli.py modules/wipo/verify_fixes.py modules/wipo/verify_new_stack.py
      # credit 模块从原仓平移进来时带着既有 lint 债务，清零属于后续任务
      # （见 docs 与 P1 清单），本轮只守「不再新增」。
      #
      # ⚠️ 这一步以前是 `ruff check ... --exit-zero`，注释写着「只守不再新增」，
      # 但 --exit-zero 的语义是**永远返回 0**，所以「不再新增」实际从未生效。
      # 现改用 tools/credit_lint_baseline.py：拿 ruff 的 JSON 结果与仓库内
      # tools/credit_lint_baseline.json 比对，出现基线里没有的（文件, 规则）
      # 组合、或同类问题变多，就退出 1。修好一处不会被拦，引入一处一定被拦。
      - name: ruff check（credit，基线守卫，只拦新增）
        run: python tools/credit_lint_baseline.py

  # ---------- Job 2：三套 pytest（必须分开跑，conftest 同名冲突） ----------
  tests:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 不进矩阵：requirements.txt 钉死 numpy==2.5.4（onnxruntime 链），
        # 该版本声明 Requires-Python >=3.12，3.11 装不上（CI 首跑实测）。
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（requirements.txt 是三模块依赖并集，版本已实测互容）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 口径与 README「测试口径」注一致：三个套件必须分开跑——
      # wipo 的 tests/ 与 tests_new/ 各有一个同名 conftest.py，
      # 合跑报 ImportError: cannot import name 'FAKE_REPORT' from 'conftest'。
      - name: credit 回归（278）
        working-directory: modules/credit
        run: python -m pytest test_regression.py -q
      - name: WIPO 契约（44）
        working-directory: modules/wipo
        run: python -m pytest tests_new -q
      - name: WIPO 缺陷回归断言（68 + 63，不经 pytest）
        working-directory: modules/wipo
        run: |
          python verify_fixes.py
          python verify_new_stack.py
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            modules/wipo/test-results/
            modules/credit/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------- Job 3：E2E + 聚合真机验收（单 job，重） ----------
  e2e:
    name: E2E（118）+ 聚合验收（76）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 安装 Playwright chromium（WIPO E2E 用；camoufox 的 firefox 只在真实巡检时才需要）
        run: python -m playwright install --with-deps chromium
      # 统一前端是独立 TS 工程，vue-tsc 能抓到「模板里引用了不存在的属性」这类
      # 构建期不一定报错、但运行期白屏的问题。单独一步，失败时比 E2E 全红好定位。
      #
      # 为什么要把三个目录的依赖都装上：web/ 的 tsconfig 通过别名（@ → credit、
      # @wipo → wipo）把两个模块的源码也纳入类型检查。TypeScript 解析裸导入
      # （vue / vue-router / pinia / @vueuse/core）是**从引用方所在目录往上找**
      # node_modules，所以只装 web/ 的依赖时，credit 与 wipo 的 .vue 会报
      # TS2307 Cannot find module 'vue'。本地因为三个目录都装过，永远测不出来。
      - name: 安装三套前端依赖（web + 两个模块）
        run: |
          for d in web modules/wipo/web modules/credit/frontend; do
            echo "== npm ci in $d =="
            (cd "$d" && npm ci --no-audit --no-fund)
          done
      - name: 统一前端类型检查（web/）
        working-directory: web
        run: npm run typecheck
      - name: 构建三套前端产物（web/dist + 每模块 dist/dist-agg）
        run: python tools/build_frontends.py
      - name: WIPO E2E（118，打默认 base 的 dist/）
        working-directory: modules/wipo
        run: python -m pytest tests -q
      - name: 聚合真机验收（76，起 uvicorn + 真 Chromium，打 web/dist）
        run: python tools/accept_aggregated.py
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            modules/wipo/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7
